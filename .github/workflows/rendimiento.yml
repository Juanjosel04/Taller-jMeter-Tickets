name: Pruebas de rendimiento

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      # JMeter 5.6.3 necesita Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar JMeter 5.6.3
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz -C "$HOME"
          echo "$HOME/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Levantar la API
        run: python3 api/ticketmania_simple.py &

      - name: Esperar a la API
        run: |
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8080/api/salud | grep -q OK; then
              echo "API lista"
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondio"
          exit 1

      - name: Ejecutar el plan de JMeter
        working-directory: pruebas/jmeter
        run: jmeter -n -t Ticketmania.jmx -l resultados.jtl -e -o reporte

      # JMeter no falla solo: se revisa la columna success del .jtl
      - name: Revisar peticiones fallidas
        working-directory: pruebas/jmeter
        run: |
          fallidas=$(awk -F',' 'NR==1 {for (i=1; i<=NF; i++) if ($i=="success") c=i; next} $c=="false"' resultados.jtl | wc -l)
          echo "Peticiones fallidas: $fallidas"
          if [ "$fallidas" -gt 0 ]; then
            exit 1
          fi

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reporte-rendimiento
          path: pruebas/jmeter/reporte
